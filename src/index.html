<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Philipp Nagel · Grid to Packet</title>
    <meta
      name="description"
      content="Scroll from the power grid down to a single smart-meter protocol frame in a pixel-art world, with the power layer and the data layer drawn together."
    />
    <meta property="og:title" content="Philipp Nagel · Grid to Packet" />
    <meta property="og:url" content="https://www.philippnagel.com" />
    <meta
      property="og:description"
      content="Scroll from the power grid to a protocol frame in a pixel-art world."
    />
    <meta property="og:type" content="website" />
    <link rel="me" href="https://www.linkedin.com/in/philippnagel/" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <div class="who">
        <img src="./profile-circle-crop.png" alt="" />
        <b>Philipp Nagel</b><span>grid → packet</span>
      </div>
      <div class="sp"></div>
      <div class="seg" id="layers" role="group" aria-label="Layer">
        <button data-m="both" aria-pressed="true">BOTH</button
        ><button data-m="p" aria-pressed="false">POWER</button
        ><button data-m="d" aria-pressed="false">DATA</button>
      </div>
      <a class="btn pri" href="https://cal.com/nagel">Book a call</a>
      <button class="btn" id="theme" aria-label="Toggle light/dark theme">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
          <circle
            cx="8"
            cy="8"
            r="6"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
          />
          <path d="M8 2a6 6 0 0 0 0 12z" fill="currentColor" />
        </svg>
      </button>
    </header>

    <div id="stage">
      <canvas
        id="cv"
        role="img"
        aria-label="Pixel-art map of power infrastructure and the data layer above it, zoomed from the grid down to a protocol frame as you scroll"
      ></canvas>
    </div>
    <article id="chapter" aria-live="polite">
      <small></small>
      <h1></h1>
      <p></p>
      <div class="cta" hidden>
        <a class="btn pri" href="https://cal.com/nagel">Book a call</a>
        <a class="btn" href="https://www.linkedin.com/in/philippnagel/" rel="me"
          >LinkedIn</a
        >
      </div>
    </article>
    <nav id="rail" aria-label="Chapters"></nav>
    <div id="hint">scroll ↓</div>
    <main id="track" aria-hidden="true"></main>
    <div id="caption" aria-live="polite"></div>
    <ul id="a11y" class="sr"></ul>
    <noscript
      ><p style="position: fixed; inset: 80px 20px; font: 15px system-ui">
        This diagram needs JavaScript.
      </p></noscript
    >

    <script type="module" src="./main.ts"></script>
  </body>
</html>
