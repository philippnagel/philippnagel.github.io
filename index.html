<style>
:root {
  --bg: #f5f6f8; --card: #ffffff; --ink: #0f172a; --mute: #5b6779; --line: #c4ccd8;
  --grid: rgba(15, 23, 42, .055); --phys: #b45309; --proto: #0e7490;
  --glow-p: rgba(180, 83, 9, .35); --glow-r: rgba(14, 116, 144, .35);
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --panel-w: 360px; --top: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a0e14; --card: #111823; --ink: #e6edf3; --mute: #8b98a9; --line: #263143;
    --grid: rgba(148, 163, 184, .07); --phys: #fbbf24; --proto: #22d3ee;
    --glow-p: rgba(251, 191, 36, .55); --glow-r: rgba(34, 211, 238, .55);
  }
}
:root[data-theme="dark"] {
  --bg: #0a0e14; --card: #111823; --ink: #e6edf3; --mute: #8b98a9; --line: #263143;
  --grid: rgba(148, 163, 184, .07); --phys: #fbbf24; --proto: #22d3ee;
  --glow-p: rgba(251, 191, 36, .55); --glow-r: rgba(34, 211, 238, .55);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--sans); overflow: hidden; }
a { color: inherit; }

/* chrome */
header {
  position: fixed; inset: 0 0 auto 0; height: var(--top); z-index: 5; display: flex; align-items: center; gap: 12px;
  padding: 0 16px; background: linear-gradient(var(--bg) 60%, transparent); pointer-events: none;
}
header > * { pointer-events: auto; }
.who { display: flex; align-items: center; gap: 10px; min-width: 0; }
.who img { width: 30px; height: 30px; border-radius: 50%; }
.who b { font-size: 15px; font-weight: 650; white-space: nowrap; }
.who span { font: 12px var(--mono); color: var(--mute); white-space: nowrap; }
.sp { flex: 1; }
.btn {
  font: 600 13px var(--sans); text-decoration: none; padding: 7px 12px; border: 1px solid var(--line);
  background: var(--card); color: var(--ink); border-radius: 8px; cursor: pointer; white-space: nowrap;
}
.btn:hover, .btn:focus-visible { border-color: var(--proto); outline: none; }
.btn.pri { background: var(--ink); color: var(--bg); border-color: var(--ink); }
#mk { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--card); }
#mk button { all: unset; cursor: pointer; padding: 7px 11px; font: 600 12px var(--mono); color: var(--mute); }
#mk button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
#mk button:focus-visible { outline: 2px solid var(--proto); outline-offset: -2px; }
#theme { width: 34px; padding: 8px 0; display: grid; place-items: center; }

#crumbs {
  position: fixed; z-index: 4; top: var(--top); left: 16px; right: calc(var(--panel-w) + 16px);
  display: flex; flex-wrap: wrap; align-items: center; gap: 4px 2px; font: 12px var(--mono);
}
#crumbs button {
  all: unset; cursor: pointer; padding: 4px 8px; border-radius: 6px; color: var(--mute); border: 1px solid transparent;
}
#crumbs button:hover, #crumbs button:focus-visible { color: var(--ink); border-color: var(--line); }
#crumbs button[aria-current] { color: var(--ink); background: var(--card); border-color: var(--line); cursor: default; }
#crumbs i { color: var(--line); font-style: normal; }
#crumbs .fr { color: var(--proto); }

#minimap { position: fixed; z-index: 4; left: 16px; bottom: 16px; width: 120px; height: 120px; }
#minimap rect { fill: var(--card); stroke: var(--line); cursor: pointer; transition: stroke .2s; }
#minimap rect.act { stroke: var(--proto); fill: color-mix(in srgb, var(--proto) 12%, var(--card)); }
#minimap text { font: 9px var(--mono); fill: var(--mute); pointer-events: none; }

#hint {
  position: fixed; z-index: 4; left: 16px; top: calc(var(--top) + 34px); font: 12px var(--mono); color: var(--mute);
  max-width: 420px; transition: opacity .6s;
}

#stage { position: fixed; inset: 0; touch-action: none; cursor: grab; }
#stage.drag { cursor: grabbing; }
svg { width: 100%; height: 100%; display: block; }

aside {
  position: fixed; z-index: 4; top: var(--top); right: 0; bottom: 0; width: var(--panel-w); padding: 18px 20px 24px;
  overflow-y: auto; background: color-mix(in srgb, var(--card) 92%, transparent); border-left: 1px solid var(--line);
  backdrop-filter: blur(8px);
}
aside .eyebrow { font: 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--mute); }
aside .eyebrow.p { color: var(--phys); } aside .eyebrow.r { color: var(--proto); }
aside h2 { margin: 6px 0 2px; font-size: 21px; line-height: 1.2; }
aside .tag { font: 12px var(--mono); color: var(--mute); margin-bottom: 12px; }
aside p { font-size: 14px; line-height: 1.55; margin: 0 0 14px; }
aside h3 { font: 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--mute); margin: 18px 0 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 12px var(--mono); padding: 5px 9px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; }
.chip.p { border-left: 3px solid var(--phys); } .chip.r { border-left: 3px solid var(--proto); }
.chip:hover, .chip:focus-visible { outline: none; border-color: var(--ink); }
.frame { border: 1px solid var(--line); border-radius: 8px; background: var(--bg); overflow: hidden; }
.frame div { padding: 7px 10px; border-top: 1px solid var(--line); }
.frame div:first-child { border-top: 0; }
.frame code { display: block; font: 12px/1.4 var(--mono); color: var(--proto); word-break: break-all; }
.frame span { display: block; font-size: 12px; color: var(--mute); margin-top: 2px; }
.frame .note { font: 11px var(--mono); color: var(--mute); background: transparent; }
.acts { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
kbd { font: 11px var(--mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; }

/* svg theme */
.fbg { fill: var(--bg); stroke: var(--line); stroke-width: 2; }
.lvl { font: 600 13px var(--mono); fill: var(--mute); letter-spacing: .12em; }
.lane { font: 600 12px var(--mono); letter-spacing: .14em; }
.lane.p { fill: var(--phys); } .lane.r { fill: var(--proto); }
.laneline { stroke-width: 1.5; stroke-dasharray: 2 6; stroke-linecap: round; opacity: .6; }
.node { cursor: pointer; transition: opacity .25s; outline: none; }
.node.dim { opacity: .3; }
.nbox { fill: var(--card); stroke: var(--line); stroke-width: 1.5; transition: stroke .2s, filter .2s; }
.node.p.on .nbox, .node.p:focus-visible .nbox { stroke: var(--phys); stroke-width: 2.5; filter: drop-shadow(0 0 10px var(--glow-p)); }
.node.r.on .nbox, .node.r:focus-visible .nbox { stroke: var(--proto); stroke-width: 2.5; filter: drop-shadow(0 0 10px var(--glow-r)); }
.node.sel .nbox { stroke-width: 3.5; }
.ntag { font: 13px var(--mono); }
.node.p .ntag { fill: var(--phys); } .node.r .ntag { fill: var(--proto); }
.nttl { font: 650 22px var(--sans); fill: var(--ink); }
.nsub { font: 14.5px var(--mono); fill: var(--mute); }
.pframe { fill: none; stroke-width: 1.5; stroke-dasharray: 5 4; }
.node.p .pframe { stroke: var(--phys); } .node.r .pframe { stroke: var(--proto); }
.phit { fill: transparent; cursor: zoom-in; }
.flow { fill: none; stroke-width: 2; }
.flow.p { stroke: var(--phys); opacity: .55; stroke-dasharray: 10 8; animation: dash 1.2s linear infinite; }
.flow.r { stroke: var(--proto); opacity: .55; stroke-dasharray: 3 7; stroke-linecap: round; animation: dash 1.2s linear infinite; }
.link { fill: none; stroke: var(--mute); stroke-width: 1.5; opacity: .22; transition: opacity .25s; }
.link.on { opacity: 1; stroke: var(--proto); stroke-width: 3; stroke-dasharray: 12 8; filter: drop-shadow(0 0 6px var(--glow-r)); animation: dash .8s linear infinite; }
.link.dim { opacity: .05; }
@keyframes dash { to { stroke-dashoffset: -36; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

@media (max-width: 880px) {
  :root { --panel-w: 0px; }
  .who span, #hint, #minimap { display: none; }
}
@media (max-width: 520px) { .who b { display: none; } }
@media (max-width: 880px) {
  #crumbs { right: 16px; }
  aside { top: auto; left: 0; width: auto; height: 42vh; border-left: 0; border-top: 1px solid var(--line); }
}
</style>
</head>

      { t: 'METI · ANRE', tag: 'Gen-2 spec · 電気事業法', l: ['Next-Gen Smart Meter Study Group', 'Gen-2 rollout done ~FY2034'],
        i: 'METI\'s agency (ANRE) owns policy and the binding Gen-2 smart meter specification, drafted by the Next-Generation Smart Meter Study Group. Gen-2 rollout began in FY2025 and completes around FY2034.' },
      { t: 'EGC · OCCTO', tag: '監視等委員会 · 広域機関', l: ['EGC: data-access oversight', 'OCCTO: EDI + market rules'],
        i: 'EGC is the independent market and data-access regulator. OCCTO sets the business-protocol standard (OCCTO EDI) and the demand-adjustment market rules. It has no role in the aggregation data chain.' },
      { t: 'TDGC · 10 TDOs', tag: '送配電網協議会', l: ['Common specs across all TDOs', 'External-connection standard'],
        i: 'The TDOs coordinate through TDGC on common specifications, for example the 特定計量システム external-connection standard shared by all 10, which suppresses the procurement fragmentation seen in larger multi-utility markets.' },
      { t: 'Data intermediary', tag: '電力データ管理協会', l: ['Certified, EBA Art.37-3/37-4', 'Single national consent gate'],
        i: 'A METI-certified association (認定協会) that governs consent and third-party data access nationally. The structural opposite of Germany\'s no-hub model: one certified intermediary for everyone who is not a retailer.' }
    ],
    links: [[0, 1], [0, 2], [1, 2], [2, 2], [3, 0], [3, 1], [3, 3]] },

  { name: 'METERING POINT',
    p: [
      { t: 'Gen-2 smart meter', tag: '次世代スマートメーター', l: ['30-min settlement data', '5-min for ≥10% of LV meters'],
        i: 'TDO-owned meter. 30-minute granularity is the standard; Gen-2 adds 5-minute collection for at least 10% of low-voltage meters, roughly five years after Australia\'s move to 5-minute settlement.' },
      { t: 'Wi-SUN mesh · FAN', tag: '920 MHz multi-hop', l: ['Meters relay for each other', 'Concentrator → WAN'],
        i: 'Meters form a multi-hop IPv6 radio mesh on 920 MHz. Concentrators collect the traffic and hand it to the TDO over a WAN. There is no per-home gateway like the German SMGW.' },
      { t: 'TDO HES · MDMS', tag: 'Per-TDO back office', l: ['HES: real-time head-end', 'MDMS: readings · assets · network'],
        i: 'Each TDO runs its own head-end system (real-time) and MDMS (reading store, asset management, network management). Consolidation happens only one layer up, in the national aggregation system.' },
      { t: 'Customer premises', tag: '需要家 · HEMS · BEMS', l: ['Direct access via B-Route', 'Zoom in ▸'],
        i: 'Home and building energy management hang off the meter through the B-Route, a consumer-direct real-time channel that bypasses the aggregation chain. Zoom in for the edge devices.' }
    ],
    r: [
      { t: 'A-Route', tag: 'Meter → TDO MDMS', l: ['Wi-SUN 920 MHz, IPv6', 'Billing-grade readings'],
        i: 'The utility route: readings travel meter to concentrator to HES to MDMS over the Wi-SUN mesh. Used for billing and settlement data.' },
      { t: 'Aggregation system', tag: '集約システム · GDBL', l: ['One national layer, all 10 TDOs', '30-min push · 3-yr retention'],
        i: 'A single national aggregation layer built and operated by GDBL. Each TDO pushes 30-minute data into it; it retains three years. This is the most centralised element among the markets in this ontology.' },
      { t: 'OCCTO EDI Ver.3A', tag: 'C-Route · retailers only', l: ['HTTPS pull of XML/ZIP', 'No consumer consent needed'],
        i: 'Retailer data path: external servers pull XML/ZIP files over HTTPS from each TDO\'s public server. It flows automatically under the wheeling contract with no consumer consent, and includes sub-meter (特定計量) data. No EDIFACT-equivalent exists here.' },
      { t: 'SMDSA · consent gate', tag: '電力データ管理協会', l: ['Web API · per-record consent', 'B1 individual / B2 statistics'], f: 'smdsa',
        i: 'The only legal path to meter data for non-retailers (DR aggregators, municipalities, building operators). Individual data (B1) needs per-record consumer consent and ISMS certification; statistics (B2) need no consent. Supply-point level only.' }
    ],
    links: [[0, 0], [1, 0], [2, 0], [2, 1], [2, 2], [2, 3], [3, 3]] },

  { name: 'EDGE DEVICES',
    p: [
      { t: 'Smart meter', tag: 'One meter, three radio routes', l: ['A-Route, B-Route, IoT-Route', 'Hard isolation between them'],
        i: 'The same Gen-2 meter exposes separate radio routes for the utility (A), the consumer (B) and cross-utility sub-meters (IoT). IoT-Route mandates network isolation from A and B, with no IP forwarding between routes.' },
      { t: 'HEMS', tag: 'B-Route LV', l: ['Home energy management', 'Real-time, unaggregated'],
        i: 'Consumer-side energy management reads the meter directly. Structurally Japan\'s analogue to the German HAN or the Dutch P1 port, but layered on top of the national aggregation chain, not instead of it.' },
      { t: 'BEMS', tag: 'B-Route HV', l: ['Building energy management', 'Large commercial'],
        i: 'High-voltage meters serve building energy management systems over a Wi-SUN B-Route.' },
      { t: 'Gas · water · EV · PV', tag: '特例計量器 · sub-meters', l: ['Co-metered via the electric meter', 'Shared data backbone'],
        i: 'Gas, water, EV charging and PV sub-meters (特例計量器) connect to the electric meter over the IoT-Route. Few countries use the electricity meter network as a shared backbone for other utilities at national scale.' }
    ],
    r: [
      { t: 'A-Route · Wi-SUN', tag: 'IEEE 802.15.4g · 920 MHz', l: ['Multi-hop IPv6 mesh', 'Meter → TDO'],
        i: 'Radio layer of the utility route: Wi-SUN Alliance profile on IEEE 802.15.4g, 920 MHz, IPv6 multi-hop.' },
      { t: 'B-Route · ECHONET Lite', tag: 'ISO/IEC 14543-4-3', l: ['Wi-SUN, Wi-Fi 2.4 GHz in Gen-2', 'Meter → HEMS / BEMS'], f: 'echonet',
        i: 'Consumer interface: ECHONET Lite object model over Wi-SUN (and Wi-Fi 2.4 GHz for LV in Gen-2). Japan does not use DLMS/COSEM here, which is why foreign meter vendors need Japan-specific variants.' },
      { t: 'IoT-Route', tag: 'TTC JJ-300.10 · May 2024', l: ['802.15.4 / 6LoWPAN / IPv6 / UDP', 'DLMS/COSEM on top'], f: 'iot',
        i: 'Sub-meter route ratified May 2024. Lower layers are the Wi-SUN stack; application layers run DLMS/COSEM, so DLMS-experienced vendors can reuse their implementation here even though ECHONET Lite is not DLMS.' },
      { t: 'Route isolation', tag: 'AES-128 · mutual auth', l: ['IoT-Route: no IP forwarding', 'between A, B and IoT routes'],
        i: 'IoT-Route requires hard network isolation from A-Route and B-Route, mutual authentication and AES-128 minimum at layer 2.' }
    ],
    links: [[0, 0], [0, 1], [0, 2], [0, 3], [1, 1], [2, 1], [3, 2]] }
];
const MARKETS = {
  de: { lv: LV_DE, label: 'Germany' },
  jp: { lv: LV_JP, label: 'Japan' }
};
let market = 'de', LV = LV_DE;
const CRUMBS = ['National Grid', 'Metering Point', 'Edge Devices'];

/* ---------- geometry ---------- */
const SZ = 1000, PW = 420, NH = 190, GAP = 40, Y0 = 100, PORT = 100, KID = PORT / SZ, DRILL = 3;
const X = { p: 30, r: 550 };
const ny = i => Y0 + i * (NH + GAP);
const PX = X.p + PW - PORT - 14, PY = ny(DRILL) + (NH - PORT) / 2;
const ORIG = [{ x: 0, y: 0, k: 1 }];
for (let l = 1; l < LV.length; l++) { const o = ORIG[l - 1]; ORIG.push({ x: o.x + o.k * PX, y: o.y + o.k * PY, k: o.k * KID }); }

const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');

function scene(l) {
  const d = LV[l];
  let s = `<rect class="fbg" width="${SZ}" height="${SZ}"/><rect width="${SZ}" height="${SZ}" fill="url(#grid)"/>`;
  s += `<text class="lvl" x="${SZ / 2}" y="30" text-anchor="middle">LEVEL ${l + 1} · ${d.name}</text>`;
  s += `<text class="lane p" x="${X.p}" y="72">PHYSICAL · POWER DELIVERY</text><text class="lane r" x="${X.r}" y="72">INFORMATION · PROTOCOL</text>`;
  d.links.forEach(([a, b], n) => {
    const y1 = ny(a) + NH / 2, y2 = ny(b) + NH / 2;
    s += `<path class="link" data-l="${l}" data-n="${n}" d="M${X.p + PW} ${y1} C${X.p + PW + 50} ${y1} ${X.r - 50} ${y2} ${X.r} ${y2}"/>`;
  });
  for (const side of ['p', 'r']) for (let i = 0; i < 3; i++)
    s += `<path class="flow ${side}" d="M${X[side] + PW / 2} ${ny(i) + NH} V${ny(i + 1)}"/>`;
  for (const side of ['p', 'r']) d[side].forEach((n, i) => {
    const x = X[side], y = ny(i), drill = side === 'p' && i === DRILL && l < LV.length - 1;
    s += `<g class="node ${side}" data-l="${l}" data-s="${side}" data-i="${i}" tabindex="0" role="button" aria-label="${esc(n.t)}">`;
    s += `<rect class="nbox" x="${x}" y="${y}" width="${PW}" height="${NH}" rx="10"/>`;
    s += `<text class="ntag" x="${x + 20}" y="${y + 36}">${esc(n.tag)}</text><text class="nttl" x="${x + 20}" y="${y + 72}">${esc(n.t)}</text>`;
    n.l.forEach((t, k) => { s += `<text class="nsub" x="${x + 20}" y="${y + 108 + k * 24}">${esc(t)}</text>`; });
    if (n.f) s += `<text class="ntag" x="${x + 20}" y="${y + NH - 14}">▤ frame</text>`;
    if (drill) {
      s += `<g transform="translate(${PX} ${PY}) scale(${KID})"><g class="scene" data-l="${l + 1}">${scene(l + 1)}</g></g>`;
      s += `<rect class="pframe" data-child="${l + 1}" x="${PX}" y="${PY}" width="${PORT}" height="${PORT}"/>`;
      s += `<rect class="phit" data-child="${l + 1}" x="${PX}" y="${PY}" width="${PORT}" height="${PORT}"/>`;
    }
    s += `</g>`;
  });
  return s;
}

/* ---------- build ---------- */
const svg = document.getElementById('svg'), stage = document.getElementById('stage');
let sceneEl, nodes, links, phits, pframes;
const byChild = sel => [...svg.querySelectorAll(sel)].sort((a, b) => a.dataset.child - b.dataset.child);
const linksOf = l => links.filter(e => +e.dataset.l === l);
function mount() {
  svg.innerHTML = `<defs><pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="var(--grid)" stroke-width="1"/></pattern></defs>
<g class="scene" data-l="0">${scene(0)}</g>`;
  sceneEl = [...svg.querySelectorAll('.scene')].sort((a, b) => a.dataset.l - b.dataset.l);
  nodes = [...svg.querySelectorAll('.node')];
  links = [...svg.querySelectorAll('.link')];
  phits = byChild('.phit'); pframes = byChild('.pframe');
}

/* ---------- camera ---------- */
let W = innerWidth, H = innerHeight;
const cam = { cx: 500, cy: 500, w: 1100 };
let anim = null, level = 0, active = [true, false, false];
const mobile = () => innerWidth <= 880;
const insets = () => {
  const top = 96, right = mobile() ? 0 : 360, bottom = mobile() ? Math.round(innerHeight * .42) : 0;
  return { top, right, bottom };
};
function fit(l) {
  const o = ORIG[l], size = SZ * o.k, ins = insets();
  const aw = W - ins.right, ah = H - ins.top - ins.bottom;
  const ps = Math.min(aw, ah) / (size * 1.05);
  const acx = aw / 2, acy = ins.top + ah / 2;
  return { cx: o.x + size / 2 - (acx - W / 2) / ps, cy: o.y + size / 2 - (acy - H / 2) / ps, w: W / ps };
}
function render() {
  const ps = W / cam.w, h = cam.w * H / W;
  svg.setAttribute('viewBox', `${cam.cx - cam.w / 2} ${cam.cy - h / 2} ${cam.w} ${h}`);
  let cur = 0;
  for (let l = 1; l < LV.length; l++) {
    const px = SZ * ORIG[l].k * ps, o = Math.min(1, Math.max(0, (px - 70) / 110)), on = o > .6;
    sceneEl[l].style.opacity = o;
    sceneEl[l].style.pointerEvents = on ? 'auto' : 'none';
    phits[l - 1].style.pointerEvents = on ? 'none' : 'all';
    pframes[l - 1].style.opacity = 1 - o;
    if (px >= .45 * Math.min(W, H)) cur = l;
    if (on !== active[l]) { active[l] = on; nodes.forEach(n => { if (+n.dataset.l === l) n.tabIndex = on ? 0 : -1; }); }
  }
  if (cur !== level) { level = cur; crumbs(); }
}
function setCam(c) { cam.cx = c.cx; cam.cy = c.cy; cam.w = c.w; render(); }
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
function flyTo(t) {
  const f = { ...cam }, dur = reduce ? 0 : 900 + 250 * Math.abs(Math.log(t.w / f.w) / Math.LN10);
  const t0 = performance.now();
  anim = id => {
    let u = dur ? Math.min(1, (id - t0) / dur) : 1;
    u = u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
    const w = Math.exp(Math.log(f.w) + (Math.log(t.w) - Math.log(f.w)) * u);
    const s = Math.abs(1 / t.w - 1 / f.w) < 1e-12 ? u : (1 / w - 1 / f.w) / (1 / t.w - 1 / f.w);
    setCam({ cx: f.cx + (t.cx - f.cx) * s, cy: f.cy + (t.cy - f.cy) * s, w });
    if (u < 1) requestAnimationFrame(anim); else anim = null;
  };
  requestAnimationFrame(anim);
}
const stop = () => { anim = null; };
const go = l => { fadeHint(); flyTo(fit(Math.max(0, Math.min(LV.length - 1, l)))); };

/* pan / zoom input */
const ptrs = new Map(); let moved = false, last = null;
const toWorld = (px, py) => { const ps = W / cam.w; return [cam.cx + (px - W / 2) / ps, cam.cy + (py - H / 2) / ps]; };
function zoomAt(px, py, f) {
  const nw = Math.min(2600, Math.max(6, cam.w * f)), [wx, wy] = toWorld(px, py), r = nw / cam.w;
  setCam({ cx: wx - (wx - cam.cx) * r, cy: wy - (wy - cam.cy) * r, w: nw });
}
stage.addEventListener('wheel', e => {
  e.preventDefault(); stop();
  zoomAt(e.clientX, e.clientY, Math.exp(e.deltaY * (e.ctrlKey ? .01 : .0015)));
  fadeHint();
}, { passive: false });
stage.addEventListener('pointerdown', e => {
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY }); moved = false; stop();
  last = pinchState();
});
addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) return;
  const p = ptrs.get(e.pointerId), dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY;
  const now = pinchState();
  if (!moved && Math.hypot(dx, dy) < 3 && ptrs.size === 1) return;
  if (!moved) { moved = true; stage.classList.add('drag'); fadeHint(); }
  const ps = W / cam.w;
  if (ptrs.size >= 2 && last && last.d) {
    zoomAt(now.x, now.y, last.d / now.d);
  }
  cam.cx -= (now.x - last.x) / (W / cam.w); cam.cy -= (now.y - last.y) / (W / cam.w);
  last = now; render();
});
const up = e => { ptrs.delete(e.pointerId); last = pinchState(); if (!ptrs.size) stage.classList.remove('drag'); };
addEventListener('pointerup', up); addEventListener('pointercancel', up);
function pinchState() {
  const a = [...ptrs.values()]; if (!a.length) return null;
  const x = a.reduce((s, p) => s + p.x, 0) / a.length, y = a.reduce((s, p) => s + p.y, 0) / a.length;
  return { x, y, d: a.length > 1 ? Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y) : 0 };
}
function fadeHint() { document.getElementById('hint').style.opacity = 0; }

/* ---------- selection + highlight ---------- */
let sel = null, hov = null;
const refOf = n => ({ l: +n.dataset.l, s: n.dataset.s, i: +n.dataset.i });
const same = (a, b) => a && b && a.l === b.l && a.s === b.s && a.i === b.i;
function related(ref) {
  const out = [];
  LV[ref.l].links.forEach(([a, b], n) => {
    if (ref.s === 'p' && a === ref.i) out.push({ n, s: 'r', i: b });
    if (ref.s === 'r' && b === ref.i) out.push({ n, s: 'p', i: a });
  });
  return out;
}
function paint() {
  const ref = hov || sel;
  nodes.forEach(n => n.classList.remove('on', 'dim', 'sel'));
  links.forEach(e => e.classList.remove('on', 'dim'));
  if (!ref) return;
  const rel = related(ref), inScene = n => +n.dataset.l === ref.l;
  nodes.filter(inScene).forEach(n => {
    const r = refOf(n), hit = same(r, ref) || rel.some(x => x.s === r.s && x.i === r.i);
    n.classList.add(hit ? 'on' : 'dim');
    if (sel && same(r, sel)) n.classList.add('sel');
  });
  linksOf(ref.l).forEach(e => e.classList.add(rel.some(x => x.n === +e.dataset.n) ? 'on' : 'dim'));
}
function select(ref) { sel = ref; paint(); panel(); crumbs(); }

/* ---------- panel + breadcrumb ---------- */
const panelEl = document.getElementById('panel');
function intro() {
  panelEl.innerHTML = `<div class="eyebrow">Grid → packet</div><h2>Two stacks, one meter</h2>
  <p>Left: the physical path electricity takes, from the transmission grid to a wallbox. Right: the regulation, market messages and device protocols that describe and control it.</p>
  <p>Select any node to light up its counterpart on the other stream, then dive in through the dashed thumbnail: <b>Connection point → Customer premises</b>.</p>
  <h3>Controls</h3><p><kbd>scroll</kbd> / pinch zoom &nbsp; <kbd>drag</kbd> pan &nbsp; <kbd>Esc</kbd> zoom out</p>`;
}
function panel() {
  if (!sel) return intro();
  const n = LV[sel.l][sel.s][sel.i], isP = sel.s === 'p';
  const rel = related(sel).map(x => LV[sel.l][x.s][x.i]).length ? related(sel) : [];
  let h = `<div class="eyebrow ${sel.s}">Level ${sel.l + 1} · ${isP ? 'Physical' : 'Protocol'}</div><h2>${esc(n.t)}</h2><div class="tag">${esc(n.tag)}</div><p>${esc(n.i)}</p>`;
  if (rel.length) {
    h += `<h3>${isP ? 'Protocols acting here' : 'Physical counterpart'}</h3><div class="chips">`;
    rel.forEach(x => { h += `<button class="chip ${x.s}" data-s="${x.s}" data-i="${x.i}">${esc(LV[sel.l][x.s][x.i].t)}</button>`; });
    h += `</div>`;
  }
  if (n.f) {
    h += `<h3>Protocol frame</h3><div class="frame">` + FRAMES[n.f].map(([c, d]) =>
      d ? `<div><code>${esc(c)}</code><span>${esc(d)}</span></div>` : `<div class="note">${esc(c)}</div>`).join('') + `</div>`;
  }
  h += `<div class="acts">`;
  if (isP && sel.i === DRILL && sel.l < LV.length - 1) h += `<button class="btn pri" data-act="in">Zoom in ▸</button>`;
  if (sel.l > 0) h += `<button class="btn" data-act="out">◂ Zoom out</button>`;
  panelEl.innerHTML = h + `</div>`;
}
panelEl.addEventListener('click', e => {
  const c = e.target.closest('.chip'), b = e.target.closest('[data-act]');
  if (c) select({ l: sel.l, s: c.dataset.s, i: +c.dataset.i });
  if (b) go(b.dataset.act === 'in' ? sel.l + 1 : sel.l - 1);
});
const crumbEl = document.getElementById('crumbs');
function crumbs() {
  const n = sel && sel.l === level ? LV[sel.l][sel.s][sel.i] : null;
  let h = '';
  for (let l = 0; l <= level; l++) {
    if (l) h += '<i>›</i>';
    const curr = l === level && !(n && n.f);
    h += `<button data-l="${l}" ${curr ? 'aria-current="step"' : ''}>${CRUMBS[l]}</button>`;
  }
  if (n && n.f) h += `<i>›</i><button class="fr" aria-current="step">Protocol Frame · ${esc(n.t)}</button>`;
  crumbEl.innerHTML = h;
  mini();
}
crumbEl.addEventListener('click', e => { const b = e.target.closest('[data-l]'); if (b) go(+b.dataset.l); });

/* minimap */
const mm = document.getElementById('minimap');
const MM = [[4, 4, 112], [14, 50, 62], [22, 82, 26]];
function mini() {
  mm.innerHTML = MM.map(([x, y, s], l) => `<rect data-l="${l}" x="${x}" y="${y}" width="${s}" height="${s}" rx="3" class="${l === level ? 'act' : ''}"/><text x="${x + 4}" y="${y + 11}">L${l + 1}</text>`).join('');
}
mm.addEventListener('click', e => { const r = e.target.closest('rect'); if (r) go(+r.dataset.l); });

/* ---------- events ---------- */
svg.addEventListener('click', e => {
  if (moved) return;
  const hit = e.target.closest('.phit');
  if (hit) { go(+hit.dataset.child); return; }
  const n = e.target.closest('.node');
  if (n) select(refOf(n)); else select(null);
});
svg.addEventListener('dblclick', e => {
  const n = e.target.closest('.node');
  if (n && n.dataset.s === 'p' && +n.dataset.i === DRILL && +n.dataset.l < LV.length - 1) go(+n.dataset.l + 1);
});
svg.addEventListener('keydown', e => {
  const n = e.target.closest && e.target.closest('.node');
  if (n && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); select(refOf(n)); }
});
svg.addEventListener('pointerover', e => {
  const n = e.target.closest('.node');
  const next = n && ((+n.dataset.l === 0) || active[+n.dataset.l]) ? refOf(n) : null;
  if (!same(next, hov)) { hov = next; paint(); }
});
svg.addEventListener('pointerleave', () => { hov = null; paint(); });
addEventListener('keydown', e => { if (e.key === 'Escape') go(level - 1); });
addEventListener('resize', () => { W = innerWidth; H = innerHeight; stop(); setCam(fit(level)); });

/* theme */
const root = document.documentElement;
try { const t = localStorage.getItem('theme'); if (t) root.dataset.theme = t; } catch (_) {}
document.getElementById('theme').addEventListener('click', () => {
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('theme', root.dataset.theme); } catch (_) {}
});

/* init */
function setMarket(m) {
  market = MARKETS[m] ? m : 'de'; LV = MARKETS[market].lv;
  sel = null; hov = null; active = [true, false, false]; level = 0;
  mount(); setCam(fit(0)); crumbs(); intro();
  document.querySelectorAll('#mk button').forEach(b => b.setAttribute('aria-pressed', b.dataset.m === market));
  try { history.replaceState(null, '', market === 'de' ? location.pathname : '#' + market); } catch (_) {}
}
document.getElementById('mk').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { stop(); setMarket(b.dataset.m); } });
setMarket(location.hash.slice(1));
window.__grid = { go, jump: l => { stop(); setCam(fit(l)); }, select, cam, get level() { return level; } };
})();
</script>
</body>
</html>
